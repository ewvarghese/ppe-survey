# Publishes the survey as a static site on GitHub Pages.
# The form auto-detects that no survey server exists and stores submissions
# on each device (export/import JSON to sync). For a shared database, run
# app.py on any server instead - same repository, same code.
name: Deploy survey to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: static

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
